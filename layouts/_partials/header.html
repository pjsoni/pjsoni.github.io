<header class="site-header">
  <div class="site-header-inner">

    <a class="site-title" href="/">
      {{ .Site.Title }}
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>

  </div>
</header>
